<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码 | 中山大学农业与生物技术学院细胞间预约系统</title>
  <style>
    :root { color-scheme: light; --green:#166534; --ink:#183153; --muted:#64748b; --line:#dbeafe; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#eff6ff,#ecfeff); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink); }
    .card { width:min(100%,520px); background:#fff; border:1px solid var(--line); border-radius:20px; padding:28px; box-shadow:0 18px 45px rgba(15,23,42,.10); }
    h1 { margin:0 0 8px; font-size:1.45rem; }
    .college { color:var(--green); font-weight:700; margin-bottom:4px; }
    p { color:var(--muted); line-height:1.7; }
    label { display:block; margin:16px 0 6px; font-weight:650; }
    input { width:100%; padding:12px 13px; border:1px solid #cbd5e1; border-radius:10px; font-size:1rem; }
    input:focus { outline:3px solid #bfdbfe; border-color:#60a5fa; }
    button, a.button { display:inline-block; width:100%; margin-top:18px; border:0; border-radius:10px; padding:13px 16px; background:#2563eb; color:#fff; font-size:1rem; font-weight:700; text-align:center; text-decoration:none; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .message { display:none; margin-top:16px; padding:12px 14px; border-radius:10px; line-height:1.65; }
    .message.success { display:block; background:#dcfce7; color:#166534; }
    .message.error { display:block; background:#fee2e2; color:#991b1b; }
    .small { font-size:.88rem; color:var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="college">中山大学农业与生物技术学院</div>
    <h1>重置密码</h1>
    <p>请输入新密码。密码至少 8 位，建议同时包含字母和数字。</p>
    <form id="reset-form">
      <label for="password">新密码</label>
      <input id="password" type="password" minlength="8" required autocomplete="new-password">
      <label for="confirm">确认新密码</label>
      <input id="confirm" type="password" minlength="8" required autocomplete="new-password">
      <button id="submit" type="submit">确认重置密码</button>
    </form>
    <div id="message" class="message"></div>
    <a class="button" href="__APP_URL__" style="display:none;background:#166534" id="back-link">返回预约系统登录</a>
    <p class="small" style="margin-top:18px">如果链接已过期，请返回登录页面重新申请找回密码。</p>
  </main>
  <script>
    const SUPABASE_URL = "__SUPABASE_URL__";
    const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY__";
    const APP_URL = "__APP_URL__";
    const params = new URLSearchParams(location.hash.replace(/^#/, ""));
    let accessToken = params.get("access_token") || "";
    let refreshToken = params.get("refresh_token") || "";
    const hashError = params.get("error_description") || params.get("error") || "";

    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");
    const submit = document.getElementById("submit");
    const backLink = document.getElementById("back-link");

    function show(kind, text) {
      message.className = "message " + kind;
      message.textContent = text;
    }

    if (!accessToken) {
      form.style.display = "none";
      backLink.style.display = "block";
      show("error", hashError || "没有检测到有效的密码重置链接。请返回登录页重新申请找回密码。");
    }

    async function refreshAccessToken() {
      if (!refreshToken) return false;
      const response = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      if (!response.ok) return false;
      const data = await response.json();
      accessToken = data.access_token || "";
      refreshToken = data.refresh_token || refreshToken;
      return Boolean(accessToken);
    }

    async function updatePassword(password) {
      const response = await fetch(SUPABASE_URL + "/auth/v1/user", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + accessToken
        },
        body: JSON.stringify({ password })
      });
      return response;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password.length < 8) return show("error", "密码至少需要 8 位。");
      if (password !== confirm) return show("error", "两次输入的密码不一致。");

      submit.disabled = true;
      submit.textContent = "正在重置...";
      try {
        let response = await updatePassword(password);
        if (response.status === 401 && await refreshAccessToken()) {
          response = await updatePassword(password);
        }
        if (!response.ok) {
          let detail = "密码重置失败，请重新申请找回密码。";
          try {
            const data = await response.json();
            detail = data.msg || data.message || data.error_description || detail;
          } catch (_) {}
          show("error", detail);
          return;
        }
        form.style.display = "none";
        backLink.style.display = "block";
        show("success", "密码已重置成功。请返回预约系统，使用新密码登录。");
      } catch (error) {
        show("error", "网络异常，暂时无法重置密码，请稍后重试。");
      } finally {
        submit.disabled = false;
        submit.textContent = "确认重置密码";
      }
    });
  </script>
</body>
</html>
